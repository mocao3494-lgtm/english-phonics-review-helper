name: Validate static site
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node -e "const fs=require('node:fs'),cp=require('node:child_process'),html=fs.readFileSync('index.html','utf8'),scripts=[...html.matchAll(/<script[^>]+src=["']\.\/([^"'?]+\.js)(?:\?[^"']*)?["']/g)].map(match=>match[1]);if(!scripts.length)throw new Error('index.html does not load any JavaScript files');for(const file of scripts){if(!fs.existsSync(file))throw new Error('Missing script referenced by index.html: '+file);cp.execFileSync(process.execPath,['--check',file],{stdio:'inherit'});}"
      - run: node --check sw.js
      - run: node tests/business-regression.js
      - run: |
          node -e "const fs=require('node:fs'),html=fs.readFileSync('index.html','utf8'),scripts=[...html.matchAll(/<script[^>]+src=["']\.\/([^"'?]+\.js)(?:\?[^"']*)?["']/g)].map(match=>match[1]),app=scripts.find(file=>/^app(?:-|\.js$)/.test(file));if(!app)throw new Error('index.html does not load an app script');const source=fs.readFileSync(app,'utf8');for(const symbol of ['function nextPlan(','function normalizeBackup','function renderProgress'])if(!source.includes(symbol))throw new Error(app+' is missing '+symbol);"
          grep -q 'id="planSummary"' index.html
          grep -q 'fetch(event.request)' sw.js
