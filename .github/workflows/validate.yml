name: Validate static site
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check master-plan.js
      - run: node --check pwa.js
      - run: node --check sw.js
      - run: |
          grep -q 'function nextPlan' app.js
          grep -q 'normalizeBackup' app.js
          grep -q 'id="planSummary"' index.html
